version = 1

[model]
architecture = "line11-dual-v1"
mapping_width = 64
channels = 64
value_hidden = 128
policy_hidden = 32
qat = true

[data]
manifest = "../../data/training/manifest.json"
augment = true
shuffle_block = 65536

[loss]
teacher_weight = 0.75
result_weight = 0.25
policy_weight = 1.0
score_scale = 600.0

[run]
output = "../../artifacts/training/run01"
device = "auto"
precision = "fp32"
seed = 42
batch_size = 16
micro_batch_size = 1
steps = 50000
learning_rate = 0.001
weight_decay = 0.0001
warmup_steps = 1000
min_lr_ratio = 0.05
grad_clip = 1.0
validate_every = 500
validation_batches = 64
checkpoint_every = 500
log_every = 25
cpu_threads = 4
