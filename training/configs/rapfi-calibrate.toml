version = 1

[model]
architecture = "line11-dual-v1"
mapping_width = 64
channels = 64
value_hidden = 128
policy_hidden = 32
qat = true

[data]
manifest = "../../data/training/rapfi-v1/manifest.json"
augment = true
shuffle_block = 65536

[loss]
# Optional teacher-only calibration after mixed supervision; keep a policy anchor.
teacher_weight = 1.0
result_weight = 0.0
policy_weight = 0.1
score_scale = 400.0

[run]
output = "../../artifacts/training/rapfi-calibrated-v1"
device = "auto"
precision = "fp32"
seed = 42
batch_size = 32
micro_batch_size = 4
steps = 1000
learning_rate = 0.0003
weight_decay = 0.0001
warmup_steps = 50
min_lr_ratio = 0.05
grad_clip = 1.0
validate_every = 100
validation_batches = 32
checkpoint_every = 100
log_every = 25
cpu_threads = 4
