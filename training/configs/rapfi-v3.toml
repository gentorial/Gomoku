version = 1

[model]
architecture = "line11-dual-v1"
mapping_width = 64
channels = 64
value_hidden = 128
policy_hidden = 32
qat = true

[data]
manifest = "../../data/training/rapfi-v3/manifest.json"
augment = true
shuffle_block = 65536

[loss]
value_target = "expected_score"
teacher_weight = 0.95
result_weight = 0.05
policy_weight = 0.25
score_scale = 400.0

[run]
output = "../../artifacts/training/rapfi-v3"
device = "auto"
precision = "bf16"
seed = 42
batch_size = 64
micro_batch_size = 8
steps = 50000
learning_rate = 0.0005
weight_decay = 0.0001
warmup_steps = 500
min_lr_ratio = 0.05
grad_clip = 1.0
validate_every = 1000
validation_batches = 64
checkpoint_every = 500
log_every = 100
cpu_threads = 4
