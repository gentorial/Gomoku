name: Set up workspace
description: Install the locked pnpm workspace and optionally the pinned Emscripten SDK.

inputs:
  wasm:
    description: Install Python and Emscripten to compile the C++ WASM adapter.
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "22"
        package-manager-cache: false
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        cache: true
    - name: Install locked dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      if: inputs.wasm == 'true'
      with:
        python-version: "3.13"
    - name: Cache pinned Emscripten SDK
      if: inputs.wasm == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .tools/emsdk
          !.tools/emsdk/downloads
        key: emsdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/wasm.mjs') }}
    - name: Install and activate Emscripten
      if: inputs.wasm == 'true'
      shell: bash
      run: pnpm wasm:setup
