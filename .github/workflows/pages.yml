name: Deploy website

# Called only after both CI matrices pass, using artifacts from that same run.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build Pages artifact
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Restore the WASM module validated by CI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engine-wasm
          path: packages/engine-wasm/generated
      - name: Read GitHub Pages URL
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Restore native NNUE parity checker
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-Linux-X64
          path: build/dev/bin
      - name: Build website for its published base path
        env:
          GOMOKU_WEB_BASE: ${{ steps.pages.outputs.base_path }}/
        run: |
          pnpm model:download
          chmod +x build/dev/bin/gomoku-nnue-check
          pnpm model:verify
          pnpm build:packages
          pnpm --filter @gomoku/web build
          pnpm web:verify
      - name: Save downloadable website
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 14
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
